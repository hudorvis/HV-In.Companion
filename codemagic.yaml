workflows:
  ios-release:
    name: In.Companion - TestFlight v26.11.27.02
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "In.Sync"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.h-v.in.companion
      vars:
        APP_STORE_APPLE_ID: '6839444405'
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: false
    scripts:
      - name: Generate Xcode project and icon
        script: |
          set -e
          command -v xcodegen || brew install xcodegen
          swift scripts/icon.swift
          xcodegen generate
      - name: Set build number
        script: |
          set -euo pipefail
          : "${APP_STORE_APPLE_ID:?Missing numeric App Store Connect Apple ID}"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          NEXT=$(( ${LATEST:-0} + 1 ))
          if [ "$NEXT" -lt 7 ]; then NEXT=7; fi
          agvtool new-version -all "$NEXT"
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project In.Companion.xcodeproj --scheme InCompanion
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
